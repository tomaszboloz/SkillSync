name: SkillSync CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  RUST_VERSION: "stable"

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. LINT, STATIC CODE ANALYSIS & FORMATTING
  # =========================================================================
  lint-and-check:
    name: Lint & Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint & TypeScript Check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Enforce Rust function size limit
        run: npm run check:loc

      - name: Verify Prettier Code Formatting
        run: npx prettier --check "src/**/*.{ts,tsx,css,json}"

      - name: Install Linux Tauri Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Rust Cache Setup
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify Rust Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Cargo Clippy (Strict Zero-Warning Policy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo Security Vulnerability Audit
        run: |
          cargo install cargo-audit
          cargo audit --file src-tauri/Cargo.lock

  # =========================================================================
  # 2. AUTOMATED UNIT & INTEGRATION TESTS
  # =========================================================================
  test:
    name: Unit & Integration Tests (${{ matrix.os }})
    needs: lint-and-check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests with Coverage (Vitest)
        run: npm run test:coverage

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust Cache Setup
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust Backend Tests (Unit & Integration)
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose --all-targets

  # =========================================================================
  # 3. MULTI-PLATFORM DESKTOP BUILD (.DMG / .MSI / .EXE)
  # =========================================================================
  build-binaries:
    name: Build Native Package (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            bundle_ext: "dmg"
          # WiX 3 requires VBScript for MSI ICE validation. It is no longer
          # shipped by the Windows Server 2025 image behind windows-latest.
          - platform: "windows-2022"
            bundle_ext: "msi"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust Cache Setup
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # A Tauri updater signature only protects an in-app update. Apple
      # Developer ID signing is an optional release hardening layer for the
      # DMG; an absent certificate must not suppress the macOS installer.
      - name: Detect optional Apple release hardening
        id: apple_release_signing
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare optional Apple Developer ID signing and notarization
        if: steps.apple_release_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for required_secret in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_BASE64; do
            if [ -z "${!required_secret:-}" ]; then
              echo "Missing required macOS release secret: ${required_secret}" >&2
              exit 1
            fi
          done
          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          test -s "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build Tauri Desktop Application
        if: steps.apple_release_signing.outputs.enabled != 'true'
        run: npm run tauri build -- --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Do not add Apple variables to the ordinary build above: an unset GitHub
      # secret becomes an empty environment variable, which Tauri interprets as
      # an invalid certificate that it tries to import.
      - name: Build signed and notarized Tauri Desktop Application
        if: steps.apple_release_signing.outputs.enabled == 'true'
        run: npm run tauri build -- --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify signed and notarized macOS distribution
        if: steps.apple_release_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="$(find src-tauri/target -type d -name 'SkillSync.app' -print -quit)"
          dmg="$(find src-tauri/target -type f -name '*.dmg' -print -quit)"
          test -n "$app_bundle"
          test -n "$dmg"

          codesign --verify --deep --strict --verbose=4 "$app_bundle"
          codesign -dv --verbose=4 "$app_bundle" 2>&1 | grep -q 'Authority=Developer ID Application:'
          spctl --assess --type execute --verbose=4 "$app_bundle"
          xcrun stapler validate "$app_bundle"

          hdiutil verify "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      - name: Sign updater package
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            updater_package="$(find src-tauri/target -type f -name '*.app.tar.gz' -print -quit)"
          else
            updater_package="$(find src-tauri/target -type f -name '*.msi' -print -quit)"
          fi
          test -n "$updater_package"
          ./node_modules/.bin/tauri signer sign "$updater_package"
          test -s "$updater_package.sig"

      - name: Record signed updater target
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            arch="$(uname -m)"
            if [ "$arch" = "arm64" ]; then arch="aarch64"; fi
            target="darwin-$arch"
          else
            target="windows-x86_64"
          fi
          printf '%s\n' "$target" > "src-tauri/target/updater-target-${{ matrix.platform }}.txt"

      - name: Verify signed updater artifacts
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            updater_package="$(find src-tauri/target -type f -name '*.app.tar.gz' -print -quit)"
          else
            updater_package="$(find src-tauri/target -type f -name '*.msi' -print -quit)"
          fi
          test -n "$updater_package"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            test -s "$updater_package.sig"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkillSync-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/**/*
            src-tauri/target/updater-target-*.txt

  # =========================================================================
  # 4. RELEASE AUTOMATION & CHECKSUMS (ONLY ON TAGGED RELEASES)
  # =========================================================================
  publish-release:
    name: Publish Official GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Compute SHA-256 Checksums
        run: |
          cd release-assets
          find . -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.tar.gz" \) -exec sha256sum {} + > checksums.sha256
          cat checksums.sha256

      - name: Build signed updater manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          root = Path("release-assets")
          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          repository = os.environ["RELEASE_REPOSITORY"]
          targets = {}

          for target_file in root.rglob("updater-target-*.txt"):
              target = target_file.read_text(encoding="utf-8").strip()
              if not target:
                  raise RuntimeError(f"Empty updater target metadata: {target_file}")
              pattern = "*.app.tar.gz" if target.startswith("darwin-") else "*.msi"
              candidates = list(target_file.parent.rglob(pattern))
              if len(candidates) != 1:
                  raise RuntimeError(
                      f"Expected exactly one {pattern} for {target}, found: {candidates}"
                  )
              artifact = candidates[0]
              signature = Path(f"{artifact}.sig")
              if not signature.is_file():
                  raise RuntimeError(f"Missing updater signature: {signature}")
              targets[target] = {
                  "url": (
                      f"https://github.com/{repository}/releases/download/v{version}/"
                      f"{quote(artifact.name)}"
                  ),
                  "signature": signature.read_text(encoding="utf-8").strip(),
              }

          if not {target.split("-", 1)[0] for target in targets} >= {"darwin", "windows"}:
              raise RuntimeError("A release must include signed macOS and Windows updater packages.")

          manifest = {
              "version": version,
              "notes": "SkillSync signed automatic update.",
              "pub_date": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc
              ).isoformat().replace("+00:00", "Z"),
              "platforms": targets,
          }
          (root / "latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Validate updater manifest
        run: |
          python3 -m json.tool release-assets/latest.json >/dev/null
          test -s release-assets/latest.json

      - name: Verify Mandatory Release Assets
        run: |
          test -n "$(find release-assets -type f -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -type f -name '*.msi' -print -quit)"
          test -n "$(find release-assets -type f -name '*.exe' -print -quit)"
          test -s release-assets/checksums.sha256

      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.tar.gz
            release-assets/**/*.sig
            release-assets/latest.json
            release-assets/checksums.sha256
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
