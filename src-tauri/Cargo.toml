[package]
name = "skillsync"
version = "1.4.1"
description = "High-Performance Cross-Platform AI Agent Skills Manager"
authors = ["Tomasz Bołoz <https://www.damtox.pl>"]
license = "MIT"
homepage = "https://www.damtox.pl"
repository = "https://github.com/tomaszboloz/SkillSync"
edition = "2021"
default-run = "skillsync"

[lib]
name = "skillsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
git2 = { version = "0.21", default-features = false, features = ["https"] }
semver = { version = "1.0", features = ["serde"] }
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
flate2 = "1.0"
tar = "0.4"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
